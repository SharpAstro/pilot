<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilot</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/">Pilot</a>
  <nav>
    <a href="#/" data-nav="overview">Overview</a>
    <a href="#/history" data-nav="history">History</a>
    <a href="#/blackbox" data-nav="blackbox">Black box</a>
    <a href="#/spend" data-nav="spend">Spend</a>
    <a href="#/launch" data-nav="launch">Launch</a>
  </nav>
  <!-- One group on the right: a narrow window wraps it within itself, so the bell stays at the far right and its
       panel, anchored to the bell's right edge, opens on screen (the bell wrapped alone to the left before). -->
  <div class="topright">
  <div class="limits" id="limits"></div>
  <span id="autopilot"></span>
  <span class="conn" id="conn" title="the stream from the dashboard server">opening stream…</span>
  <div class="bellwrap">
    <button class="bell" id="bell" title="Notices" aria-label="Notices">🔔<span class="badge" id="badge" hidden></span></button>
    <div class="panel" id="panel" hidden>
      <div class="panel-head"><b>Notices</b>
        <span><button id="desk" title="Show these as desktop notifications too">desktop</button>
        <button id="readall">mark all read</button></span></div>
      <div class="panel-list" id="notes"></div>
    </div>
  </div>
  </div>
</header>
<div id="errors"></div>
<div id="alerts"></div>
<main id="view"></main>
<script src="/app.js"></script>
</body>
</html>
