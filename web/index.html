<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilot</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/">Pilot</a>
  <nav>
    <a href="#/" data-nav="overview">Overview</a>
    <a href="#/history" data-nav="history">History</a>
    <a href="#/spend" data-nav="spend">Spend</a>
    <a href="#/launch" data-nav="launch">Launch</a>
  </nav>
  <div class="limits" id="limits"></div>
  <span class="conn" id="conn" title="connection to the dashboard server">connecting…</span>
  <div class="bellwrap">
    <button class="bell" id="bell" title="Notifications" aria-label="Notifications">🔔<span class="badge" id="badge" hidden></span></button>
    <div class="panel" id="panel" hidden>
      <div class="panel-head"><b>Notifications</b>
        <span><button id="desk" title="Show these as desktop notifications too">desktop</button>
        <button id="readall">mark all read</button></span></div>
      <div class="panel-list" id="notes"></div>
    </div>
  </div>
</header>
<div id="errors"></div>
<div id="alerts"></div>
<main id="view"></main>
<script src="/app.js"></script>
</body>
</html>
